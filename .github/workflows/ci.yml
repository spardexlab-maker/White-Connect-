name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/shared test
      - run: pnpm typecheck
      - run: supabase start -x studio,imgproxy,logflare,vector,supavisor
      - name: Serve edge functions (attachment scanner used by integration tests)
        run: |
          printf 'WORKER_SHARED_SECRET=ci-secret\nAPP_ENV=development\n' > supabase/functions/.env
          nohup supabase functions serve --env-file supabase/functions/.env > /tmp/functions.log 2>&1 &
          sleep 10
      - run: supabase db reset
      - run: supabase test db
      - run: pnpm test:integration
      - name: Generated types are up to date
        run: |
          supabase gen types typescript --local > packages/shared/src/database.types.ts
          git diff --exit-code packages/shared/src/database.types.ts
      - run: pnpm --filter @app/web build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
