# Builds the Google Play bundle (.aab) signed with the private upload key.
# Run it by hand (Actions → Mobile Play bundle → Run workflow). The bundle comes
# out as a workflow artifact to upload in Play Console; Google re-signs it with
# the app signing key (Play App Signing). The side-loaded test APKs from
# mobile-release.yml keep their test key, so testers' installs still update.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_UPLOAD_KEYSTORE_B64  — the upload keystore, base64
#   ANDROID_UPLOAD_PASSWORD      — its password (store and key share it)
name: Mobile Play bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-play
  cancel-in-progress: false

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check the upload key is configured
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          PW: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Add the secrets ANDROID_UPLOAD_KEYSTORE_B64 and ANDROID_UPLOAD_PASSWORD first."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @app/mobile...

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" > /dev/null

      - name: Generate native project with the upload key
        working-directory: apps/mobile
        env:
          KS: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          cp .env.example .env
          npx expo prebuild -p android --no-install
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          # release builds sign with the upload key (a second android {} block merges into the generated one)
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  upload {
                      storeFile file(System.getenv("UPLOAD_STORE_FILE"))
                      storePassword System.getenv("UPLOAD_PASSWORD")
                      keyAlias "abyad-upload"
                      keyPassword System.getenv("UPLOAD_PASSWORD")
                  }
              }
              buildTypes { release { signingConfig signingConfigs.upload } }
          }
          GRADLE

      - name: Build the signed bundle
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          UPLOAD_STORE_FILE: ${{ runner.temp }}/upload.jks
          UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_MOBILE_PROJECT }}
          SENTRY_DISABLE_AUTO_UPLOAD: ${{ secrets.SENTRY_AUTH_TOKEN == '' && 'true' || 'false' }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Check the signature
        run: |
          AAB=apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256" | head -3
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: abyad-play-bundle
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
