# Builds an UNSIGNED iPhone app (.ipa) for personal testing on one device and
# attaches it to the prerelease `ios-v<version>`. Sign + install it with a
# free Apple ID using Sideloadly (Windows/Mac); it runs for 7 days and can be
# re-signed. Later JS changes arrive over the air (mobile-ota.yml), so a new
# IPA is only needed when the app version / runtimeVersion changes.
name: iOS test build (unsigned)

on:
  push:
    branches: [claude/friendly-lamport-sjzzos]
    paths: ['apps/mobile/app.json', '.github/workflows/ios-unsigned.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-unsigned
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Read app version
        id: v
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "ios-v$VERSION" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @app/mobile...

      - name: Generate native project
        working-directory: apps/mobile
        run: |
          cp .env.example .env
          npx expo prebuild -p ios --no-install
          # a free Apple ID cannot sign push-notification entitlements;
          # medicine reminders are local notifications and do not need them
          for f in ios/*/*.entitlements; do
            /usr/libexec/PlistBuddy -c 'Delete :aps-environment' "$f" 2>/dev/null || true
          done

      - name: Install pods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Build (no code signing)
        working-directory: apps/mobile/ios
        env:
          NODE_ENV: production
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40

      - name: Package .ipa
        working-directory: apps/mobile/ios
        run: |
          VERSION=$(node -p "require('../app.json').expo.version")
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -qry "WhiteConnect-$VERSION-unsigned.ipa" Payload
          ls -lh *.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WhiteConnect-ios-unsigned
          path: apps/mobile/ios/*.ipa
          retention-days: 30

      - name: Publish ios-v${{ steps.v.outputs.version }}
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ios-v${{ steps.v.outputs.version }}" apps/mobile/ios/*.ipa --prerelease --target "$GITHUB_SHA" \
            --title "iPhone ${{ steps.v.outputs.version }} (تجريبي، غير موقّع)" \
            --notes "للتجربة على آيفون واحد: ثبّته عبر Sideloadly بحساب Apple ID مجاني. التحديثات اللاحقة تصل تلقائياً داخل التطبيق."
